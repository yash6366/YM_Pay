name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Run Unit & Financial Invariant Tests
        run: npm test

      - name: Run Production Build
        run: npm run build
        env:
          JWT_SECRET: ci-dummy-jwt-secret-for-build
          NEON_DATABASE_URL: postgresql://neondb_owner:password@ep-example.us-east-1.aws.neon.tech/neondb?sslmode=require
          NODE_ENV: production
